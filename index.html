<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRUSTY Links</title>
<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

body::before {
    content: "";
    position: absolute;
    top:0; left:0;
    width:100%; height:100%;
    background: url('logo.png') no-repeat center center;
    background-size: cover;
    filter: blur(8px) brightness(0.95);
    z-index: -1;
}

.buttons {
    display: flex;
    flex-direction: column;
    gap: 20px;
    width: 90%; /* ширина кнопок адаптивная */
    max-width: 400px; /* не слишком широкие на больших экранах */
}

.btn {
    background-color: rgba(76, 175, 80, 0.9);
    color: white;
    padding: 18px 10px; /* горизонтальные отступы уменьшены */
    border: none;
    border-radius: 50px;
    font-size: 20px;
    font-weight: bold;
    text-decoration: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    transition: all 0.3s ease;
    box-shadow: 0 6px 12px rgba(0,0,0,0.3);
    word-wrap: break-word; /* текст не выходит за рамку */
}

.btn:hover {
    transform: scale(1.05);
    box-shadow: 0 10px 20px rgba(0,0,0,0.35);
}

.icon {
    width: 28px;
    height: 28px;
    flex-shrink: 0; /* иконка не сжимается */
}

@media (max-width: 400px) {
    .btn {
        font-size: 18px;
        padding: 15px 8px;
        gap: 8px;
    }
    .icon {
        width: 24px;
        height: 24px;
    }
}
</style>
</head>
<body>

<div class="buttons">
    <a href="https://www.instagram.com/crustyandmore?igsh=MTlmMmppcGsxaXRjbg==" class="btn" target="_blank">
        <img src="instagram.png" class="icon"> Instagram
    </a>
    <a href="https://www.facebook.com/share/1F1ztUkc4F/?mibextid=wwXIfr" class="btn" target="_blank">
        <img src="facebook.png" class="icon"> Facebook
    </a>
    <a href="https://www.tiktok.com/@crustyandmore?_r=1&_t=ZS-937K9TkOCH7" class="btn" target="_blank">
        <img src="tiktok.png" class="icon"> TikTok
    </a>
    <a href="tel:+374033206006" class="btn">
        <img src="phone.png" class="icon"> Позвонить 

    </a>
</div>

</body>
</html>
